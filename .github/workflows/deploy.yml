name: Deploy to Cloudflare Pages

# The site is static: site/ is committed, so there is nothing to build here.
# Cloudflare Pages direct upload does not publish on git push by itself, so
# without this workflow, editing the page and pushing would publish nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push landing while a deploy is in flight should supersede it, not race it.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name=usajobs-career-explorer --branch=main --commit-dirty=true
